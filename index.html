<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/cute-deer-hearts-031389b1-32.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://i.imgur.com/8MMPtl5.gif">
    <title>folkstay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="bottom-panel">
        <img src="man.png" alt="profile">
        <img src="glass.png" alt="search">
        <img src="mas.png" alt="matches">
        <img src="message.png" alt="messages">
        <img src="rec.png" alt="recents">
    </nav>

    <header class="top-panel">
        <img src="vector.png" alt="vector">
        <p class="panel-center">Уведомления</p>
    </header>

    <main class="cards-container" id="cards-container">
    </main>

    <template id="card-template">
        <div class="box1">
            <img class="box1-image" alt="friendship image">
            <div class="content">
                <div class="card">
                    <div class="card-top">
                        <div class="info">
                            <img src="crown.png" alt="crown" class="crown-img">
                        </div>
                        <div class="name-age">
                            <span class="name"></span>
                            <span class="separator">|</span>
                            <span class="age"></span>
                        </div>
                        <div class="info">
                            <img src="scorpio.png" alt="scorpio" class="scorpio-img">
                        </div>   
                        <div class="info">
                            <img src="medal.png" alt="medal" class="medal-img">
                        </div>    
                        <div class="circle"></div>
                    </div>
                    <p class="description"></p>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>

</html>
