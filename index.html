<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/cute-deer-hearts-031389b1-32.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://i.imgur.com/8MMPtl5.gif">
    <title>folkstay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="bottom-panel">
        <img src="man.png" alt="profile">
        <img src="glass.png" alt="search">
        <img src="mas.png" alt="matches">
        <img src="message.png" alt="messages">
        <img src="rec.png" alt="recents">
    </nav>

    <header class="top-panel">
        <img src="vector.png" alt="vector">
        <p class="panel-center">Уведомления</p>
    </header>

    <main class="cards-container">
        <div class="box1" id="profile-card-1">
            <img class="box1-image" id="profile-image-1" src="https://i.pinimg.com/736x/4b/3f/8a/4b3f8aef9f1ae3ab0ac1a4661f4acd69.jpg" alt="friendship image">

            <div class="content" id="profile-content-1">
                <div class="card" id="user-card-1">
                    <div class="card-top" id="user-info-top-1">
                        <div class="info" id="crown-icon-1">
                            <img src="crown.png" alt="crown" id="crown-img-1">
                        </div>
                        <div class="name-age" id="user-name-age-1">
                            <span class="name" id="user-name-1">Анна</span>
                            <span class="separator" id="name-separator-1">|</span>
                            <span class="age" id="user-age-1">24 года</span>
                        </div>
                        <div class="info" id="scorpio-icon-1">
                            <img src="scorpio.png" alt="scorpio" id="scorpio-img-1">
                        </div>   
                        <div class="info" id="medal-icon-1">
                            <img src="medal.png" alt="medal" id="medal-img-1">
                        </div>    
                        <div class="circle" id="status-circle-1"></div>
                    </div>
                    
                    <p class="description" id="user-description-1">
                        👫 Не против сходить на свидание
                    </p>
                </div>
            </div>
        </div>

        <div class="box1" id="profile-card-2">
            <img class="box1-image" id="profile-image-2" src="https://i.pinimg.com/736x/4b/3f/8a/4b3f8aef9f1ae3ab0ac1a4661f4acd69.jpg" alt="friendship image">

            <div class="content" id="profile-content-2">
                <div class="card" id="user-card-2">
                    <div class="card-top" id="user-info-top-2">
                        <div class="info" id="crown-icon-2">
                            <img src="crown.png" alt="crown" id="crown-img-2">
                        </div>
                        <div class="name-age" id="user-name-age-2">
                            <span class="name" id="user-name-2">Анна</span>
                            <span class="separator" id="name-separator-2">|</span>
                            <span class="age" id="user-age-2">24 года</span>
                        </div>
                        <div class="info" id="scorpio-icon-2">
                            <img src="scorpio.png" alt="scorpio" id="scorpio-img-2">
                        </div>   
                        <div class="info" id="medal-icon-2">
                            <img src="medal.png" alt="medal" id="medal-img-2">
                        </div>    
                        <div class="circle" id="status-circle-2"></div>
                    </div>
                    
                    <p class="description" id="user-description-2">
                        👫 Не против сходить на свидание
                    </p>
                </div>
            </div>
        </div>

        <div class="box1" id="profile-card-3">
            <img class="box1-image" id="profile-image-3" src="https://i.pinimg.com/736x/4b/3f/8a/4b3f8aef9f1ae3ab0ac1a4661f4acd69.jpg" alt="friendship image">

            <div class="content" id="profile-content-3">
                <div class="card" id="user-card-3">
                    <div class="card-top" id="user-info-top-3">
                        <div class="info" id="crown-icon-3">
                            <img src="crown.png" alt="crown" id="crown-img-3">
                        </div>
                        <div class="name-age" id="user-name-age-3">
                            <span class="name" id="user-name-3">Анна</span>
                            <span class="separator" id="name-separator-3">|</span>
                            <span class="age" id="user-age-3">24 года</span>
                        </div>
                        <div class="info" id="scorpio-icon-3">
                            <img src="scorpio.png" alt="scorpio" id="scorpio-img-3">
                        </div>   
                        <div class="info" id="medal-icon-3">
                            <img src="medal.png" alt="medal" id="medal-img-3">
                        </div>    
                        <div class="circle" id="status-circle-3"></div>
                    </div>
                    
                    <p class="description" id="user-description-3">
                        👫 Не против сходить на свидание
                    </p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
